name: Ibex Binding Human Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]

concurrency:
  group: ibex-binding-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  binding-human-review:
    name: Binding human review receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install exact-head runtime
        run: python -m pip install -e . pytest==8.4.1

      - name: Run binding receipt regressions
        run: |
          mkdir -p artifacts
          python -m pytest -q \
            tests/test_human_review_receipts.py \
            tests/test_human_review_gate_regressions.py \
            tests/test_human_review_schema_parity.py \
            --junitxml=artifacts/human-review-receipts.xml

      - name: Collect authoritative GitHub review evidence
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require("node:fs");
            const pull = context.payload.pull_request;
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                per_page: 100,
              },
            );

            const permissions = new Map();
            for (const review of reviews) {
              const login = review.user?.login;
              if (!login || permissions.has(login)) continue;
              let permission = "none";
              try {
                const response = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: login,
                });
                permission = response.data.permission || "none";
              } catch (error) {
                core.info(`No binding repository permission resolved for ${login}`);
              }
              permissions.set(login, permission);
            }

            const normalized = reviews.map((review) => ({
              review_id: review.id,
              reviewer: review.user?.login || "unknown-reviewer",
              state: review.state,
              commit_id: review.commit_id || "",
              submitted_at: review.submitted_at,
              review_url: review.html_url,
              reviewer_permission: permissions.get(review.user?.login) || "none",
            }));
            fs.writeFileSync(
              "artifacts/github-reviews.json",
              `${JSON.stringify(normalized, null, 2)}\n`,
            );

      - name: Evaluate exact-head PRE_MERGE gate
        id: gate
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          OBSERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/ibex_human_review_gate.py \
            --repository "$REPOSITORY" \
            --pull-request "$PR_NUMBER" \
            --head "$HEAD_SHA" \
            --author "$PR_AUTHOR" \
            --reviews artifacts/github-reviews.json \
            --observed-at "$OBSERVED_AT" \
            --policy-version human-review-policy-v1 \
            --output artifacts/human-review-gate.json \
            --github-output "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          from pathlib import Path

          gate = json.loads(
              Path("artifacts/human-review-gate.json").read_text(encoding="utf-8")
          )
          lines = [
              "# Binding human review gate",
              "",
              f"**Status:** `{gate['status']}`  ",
              f"**Gate satisfied:** `{str(gate['gate_satisfied']).lower()}`  ",
              f"**Merge authorized:** `{str(gate['merge_authorized']).lower()}`  ",
              f"**Gate record:** `{gate['gate_record_id']}`",
              "",
          ]
          if gate["receipt"]:
              receipt = gate["receipt"]
              lines.extend([
                  f"**Reviewer:** `{receipt['reviewer']}`  ",
                  f"**Reviewed head:** `{receipt['head_sha']}`  ",
                  f"**Phase:** `{receipt['phase']}`  ",
                  f"**Receipt:** `{receipt['receipt_id']}`",
                  "",
              ])
          if gate["reasons"]:
              lines.extend(["## Pending or rejected evidence", ""])
              for reason in gate["reasons"]:
                  lines.append(f"- `{reason['code']}`")
          Path("artifacts/human-review-summary.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          cat artifacts/human-review-summary.md >> "$GITHUB_STEP_SUMMARY"
          grep -F '"merge_authorized": false' artifacts/human-review-gate.json

      - name: Enforce approval after draft phase
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          GATE_STATUS: ${{ steps.gate.outputs.status }}
        run: |
          if [[ "$IS_DRAFT" == "false" && "$GATE_STATUS" != "SATISFIED" ]]; then
            echo "Ready pull requests require an eligible approval bound to the exact head."
            exit 1
          fi

      - name: Upload human review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ibex-human-review-${{ github.event.pull_request.head.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30
