name: Ibex Temporal Phase Relations

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ibex-temporal-phase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  temporal-phase-relation:
    name: Expected vs observed transition
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install exact-head runtime
        run: python -m pip install -e . pytest==8.4.1

      - name: Run temporal, phase, freshness and outcome regressions
        run: |
          mkdir -p artifacts
          python -m pytest -q tests/test_temporal_phase_relations.py \
            --junitxml=artifacts/temporal-phase-relations.xml

      - name: Recompute published expected/observed comparison
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" ]]
          python scripts/ibex_temporal_phase_relation.py \
            --vector qa/temporal-phase-relation-vector.json \
            --output artifacts/temporal-phase-comparison.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          comparison = json.loads(
              Path("artifacts/temporal-phase-comparison.json").read_text(encoding="utf-8")
          )
          assert comparison["status"] == "MATCH"
          assert comparison["transition_supported"] is True
          assert comparison["transition_authorized"] is False
          Path("artifacts/exact-head.json").write_text(
              json.dumps(
                  {
                      "head_sha": os.environ["EXPECTED_HEAD"],
                      "comparison_id": comparison["comparison_id"],
                      "transition_authorized": False,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish relation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ibex-temporal-phase-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30
