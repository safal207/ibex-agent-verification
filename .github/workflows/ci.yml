name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and contract runner
        run: python -m pip install -e . pytest==8.4.1
      - name: Prove verifier-depth contracts are collected
        run: |
          python -m pytest --collect-only -q tests/test_verifier_depth.py \
            | tee verifier-depth-collection.txt
          grep -F \
            "tests/test_verifier_depth.py::test_trust_domain_mismatch_is_collision" \
            verifier-depth-collection.txt
      - name: Run complete contract suite
        run: python -m pytest -q
      - name: Verify installed wheel schema
        if: matrix.python-version == '3.11'
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv /tmp/ibex-wheel-check
          /tmp/ibex-wheel-check/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/ibex-wheel-check/bin/python - <<'PY'
          from ibex_agent_verification.schema_validation import validate_guardrail_decision

          evidence = "sha256:" + "a" * 64
          decision = {
              "schema_version": 1,
              "decision_id": "gd_wheel_001",
              "tool_call_id": "tc_wheel_001",
              "decision": "REPAIR",
              "reason_code": "WHEEL_SMOKE_TEST",
              "policy_version": "policy-v1",
              "verifier_depth": "D2",
              "allowed_runtime_use": ["STRUCTURED_REPLAN"],
              "trust_domain": "tenant:wheel",
              "claim_ceiling": "bounded-third-party-reproducible",
              "permitted_next_transition": "REPLAN_WITHIN_TRUST_DOMAIN",
              "evidence_refs": [evidence],
              "issued_at": "2026-06-30T12:00:00Z",
          }
          assert validate_guardrail_decision(decision) == ()
          PY
      - name: Run fixture demo
        run: ./scripts/run_fixture_demo.sh
